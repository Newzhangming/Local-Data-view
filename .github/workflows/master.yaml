# https://github.com/effortless-innovations/deshan-admin/actions
# https://tooltt.com/crontab/c/102.html

name: 推送构建与定时构建

on:
  push:
    branches:
      - master
      - 'releases/**'
  schedule:
    # 每6分钟执行
    # - cron: '*/6 * * * *'
    # 每天的5:30执行命令
    # - cron: '30 5 * * *'
    # 每月4号的6:32分执行
    - cron: '32 6 4 * *'
    # 每年的6月4日21点43分执行
    - cron: '43 21 4 6 *'

jobs:
  Deployment:
    runs-on: ubuntu-latest
    steps:
      #- name: Set up QEMU
      #  uses: docker/setup-qemu-action@v3

      #- name: Set up Docker Buildx
      #  uses: docker/setup-buildx-action@v3

      - name: Checkout the latest code
        uses: actions/checkout@v4

      - name: Download the environment file
        shell: bash
        run: |
          curl ${{vars.ENV_URL}} >> .env

      - name: get-npm-version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@v1.3.1
        with:
          path: .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          #platforms: linux/amd64,linux/arm64
          # 多平台特别慢，所以改用linux/amd64
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            "${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:latest"
            "${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${{ steps.package-version.outputs.current-version }}"

      - name: executing remote ssh commands using ssh key
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.REMOTE_HOST }}
          username: ${{ vars.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          script: |
            cd ~/code-repo/${{ github.event.repository.name }}
            bash up.sh

      - name: WeChat Work notification by text
        uses: chf007/action-wechat-work@master
        env:
          WECHAT_WORK_BOT_WEBHOOK: ${{secrets.WECHAT_WORK_BOT_WEBHOOK}}
        with:
          msgtype: text
          mentioned_list: '["@all"]'
          content: "${{ github.event.repository.name }}部署成功，请各位留意！"
